name: C.O.R.E. Audit

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Website(s) to audit, comma separated (e.g. athanmarketing.com)"
        required: true
        default: "athanmarketing.com"
      pages:
        description: "Max pages to crawl"
        default: "25"
      city:
        description: "City (helps find the Google Business Profile). Optional"
        default: ""
      local:
        description: "Force the Google Business Profile check"
        type: boolean
        default: false
      no_ai:
        description: "Skip the AI judge"
        type: boolean
        default: false
      no_keywords:
        description: "Skip keyword data (no DataForSEO cost)"
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check keys
        run: python -m coreaudit.doctor
      - name: Run audits
        env:
          URLS: ${{ inputs.urls }}
          PAGES: ${{ inputs.pages }}
          NO_AI: ${{ inputs.no_ai }}
          NO_KW: ${{ inputs.no_keywords }}
          CITY: ${{ inputs.city }}
          LOCAL: ${{ inputs.local }}
        run: |
          mkdir -p out
          IFS=',' read -ra LIST <<< "$URLS"
          for u in "${LIST[@]}"; do
            u="$(echo "$u" | xargs)"
            name="$(echo "$u" | sed -E 's#https?://##; s#[^A-Za-z0-9]+#-#g')"
            flags=(--pages "$PAGES")
            [ "$NO_AI" = "true" ] && flags+=(--no-ai)
            [ "$NO_KW" = "true" ] && flags+=(--no-keywords)
            [ "$LOCAL" = "true" ] && flags+=(--local)
            [ -n "$CITY" ] && flags+=(--city "$CITY")
            python -m coreaudit --url "$u" --out "out/$name.json" "${flags[@]}" | tee -a out/summary.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: core-audit-results
          path: out/
